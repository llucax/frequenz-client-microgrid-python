# Caller for the Dependabot migration reusable workflow.
# Actual logic lives in frequenz-floss/gh-workflow-dependabot-migrate.
#
# Dependabot (github-actions ecosystem) keeps the version reference
# up to date.  The companion auto-dependabot workflow skips repo-config
# group PRs so they're handled exclusively by the migration workflow.
#
# XXX: !!! SECURITY WARNING !!!
# pull_request_target has write access to the repo, and can read secrets.
# This is required because Dependabot PRs are treated as fork PRs: the
# GITHUB_TOKEN is read-only and secrets are unavailable with a plain
# pull_request trigger.  The reusable workflow mitigates the risk by:
#   - Never executing code from the PR (migrate.py is fetched from an
#     upstream tag, not from the checked-out branch).
#   - Gating migration steps on github.actor == 'dependabot[bot]'.
#   - Running approve/merge in a separate job that never checks out code.
# For more details read:
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

name: Repo Config Migration

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  repo-config-migration:
    name: Migrate Repo Config
    if: contains(github.event.pull_request.title, 'the repo-config group')
    runs-on: ubuntu-slim
    steps:
      - name: Generate token
        id: create-app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf  # v2.2.1
        with:
          app-id: ${{ secrets.FREQUENZ_AUTO_DEPENDABOT_APP_ID }}
          private-key: ${{ secrets.FREQUENZ_AUTO_DEPENDABOT_APP_PRIVATE_KEY }}
      - name: Migrate
        uses: frequenz-floss/gh-workflow-dependabot-migrate@23d9656798870b47b762aca522362c26d44fd417
        with:
          script-url-template: >-
            https://raw.githubusercontent.com/frequenz-floss/frequenz-repo-config-python/{version}/cookiecutter/migrate.py
          label-prefix: "tool:repo-config"
          auto-merge-on-changes: "true"
          token: ${{ steps.create-app-token.outputs.token }}
